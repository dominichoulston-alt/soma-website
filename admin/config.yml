backend:
  name: github
  repo: dominichoulston-alt/soma-website
  branch: main

publish_mode: simple
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Every field below is a plain text/string/markdown value. There are no
# fields here that can change colours, layout, structure or animation —
# those remain fixed in the site's templates and stylesheets, outside the
# client's reach.
collections:
  - name: "home"
    label: "Homepage"
    files:
      - name: "home"
        label: "Homepage Content"
        file: "content/home.yml"
        fields:
          - name: "hero"
            label: "Hero"
            widget: "object"
            fields:
              - { name: "lead", label: "Lead-in word", widget: "string" }
              - { name: "line1", label: "Headline line 1", widget: "string" }
              - { name: "line2", label: "Headline line 2", widget: "string" }
              - { name: "line3", label: "Headline line 3 (highlighted)", widget: "string" }
              - { name: "lede", label: "Supporting paragraph", widget: "text" }
              - { name: "cta_primary", label: "Primary button text", widget: "string" }
              - { name: "cta_secondary", label: "Secondary link text", widget: "string" }
          - name: "intro"
            label: "About Intro"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading_pre", label: "Heading (before highlight)", widget: "string" }
              - { name: "heading_accent", label: "Heading highlighted word", widget: "string" }
              - { name: "heading_post", label: "Heading (after highlight)", widget: "string" }
              - { name: "p1", label: "Paragraph 1", widget: "text" }
              - { name: "p2", label: "Paragraph 2", widget: "text" }
              - { name: "cta", label: "Link text", widget: "string" }
              - { name: "stat1_label", label: "Stat 1 label", widget: "string" }
              - { name: "stat2_label", label: "Stat 2 label", widget: "string" }
          - name: "history"
            label: "History"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - name: "stages"
                label: "Timeline Stages"
                widget: "list"
                min: 8
                max: 8
                fields:
                  - { name: "year", label: "Start year", widget: "string" }
                  - { name: "range", label: "Year range", widget: "string" }
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "text", label: "Text", widget: "text" }
          - name: "engage"
            label: "When Clients Engage"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
              - name: "items"
                label: "Items"
                widget: "list"
                min: 4
                max: 4
                fields:
                  - { name: "heading_pre", label: "Heading (before highlight)", widget: "string" }
                  - { name: "heading_accent", label: "Heading highlighted word", widget: "string" }
                  - { name: "body", label: "Body", widget: "text" }
          - name: "expertise"
            label: "Expertise"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading_pre", label: "Heading (before highlight)", widget: "string" }
              - { name: "heading_accent", label: "Heading highlighted word", widget: "string" }
              - { name: "heading_post", label: "Heading (after highlight)", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
              - name: "panels"
                label: "Capability Panels"
                widget: "list"
                min: 6
                max: 6
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "challenge", label: "The Challenge", widget: "text" }
                  - { name: "does", label: "What Soma Does", widget: "text" }
                  - { name: "outcome", label: "The Outcome", widget: "text" }
              - { name: "note", label: "Note", widget: "text" }
              - { name: "testimonial_quote", label: "Testimonial quote", widget: "text" }
              - { name: "testimonial_cite", label: "Testimonial citation", widget: "string" }
          - name: "featured_case"
            label: "Featured Case Study"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
              - { name: "badge", label: "Badge", widget: "string" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "lede1", label: "Lede 1", widget: "text" }
              - { name: "lede2", label: "Lede 2", widget: "text" }
              - { name: "stat_big_label", label: "Big stat label", widget: "string" }
              - { name: "stat1_label", label: "Stat 1 label", widget: "string" }
              - { name: "stat2_label", label: "Stat 2 label", widget: "string" }
              - { name: "stat3_label", label: "Stat 3 label", widget: "string" }
              - { name: "cta", label: "Link text", widget: "string" }
              - { name: "more_label", label: "'More from Soma' label", widget: "string" }
              - { name: "more_cta", label: "'More from Soma' link text", widget: "string" }
              - { name: "reserved1_title", label: "Reserved case 1 title", widget: "string" }
              - { name: "reserved1_body", label: "Reserved case 1 body", widget: "string" }
              - { name: "reserved2_title", label: "Reserved case 2 title", widget: "string" }
              - { name: "reserved2_body", label: "Reserved case 2 body", widget: "string" }
          - name: "difference"
            label: "What Sets Soma Apart"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - name: "stages"
                label: "Stages"
                widget: "list"
                min: 4
                max: 4
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "body", label: "Body", widget: "text" }
              - { name: "testimonial_quote", label: "Testimonial quote", widget: "text" }
              - { name: "testimonial_cite", label: "Testimonial citation", widget: "string" }
          - name: "testimonials"
            label: "Testimonial Band"
            widget: "object"
            fields:
              - { name: "quote1", label: "Quote 1", widget: "text" }
              - { name: "cite1", label: "Citation 1", widget: "string" }
              - { name: "quote2", label: "Quote 2", widget: "text" }
              - { name: "cite2", label: "Citation 2", widget: "string" }
          - name: "contact"
            label: "Contact Section"
            widget: "object"
            fields:
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "body", label: "Body", widget: "text" }

  - name: "services"
    label: "Services Page"
    files:
      - name: "services"
        label: "Services Content"
        file: "content/services.yml"
        fields:
          - name: "page_header"
            label: "Page Header"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
          - name: "section_head"
            label: "Section Head"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
          - name: "panels"
            label: "Capability Panels"
            widget: "list"
            min: 6
            max: 6
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "challenge", label: "The Challenge", widget: "text" }
              - { name: "does", label: "What Soma Does", widget: "text" }
              - { name: "outcomes", label: "Typical Outcomes", widget: "text" }
          - { name: "testimonial_quote", label: "Testimonial quote", widget: "text" }
          - { name: "testimonial_cite", label: "Testimonial citation", widget: "string" }
          - name: "legacy"
            label: "Legacy Framework"
            widget: "object"
            fields:
              - { name: "label", label: "Label", widget: "string" }
          - name: "methodology"
            label: "Methodology"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "p1", label: "Paragraph 1", widget: "text" }
              - { name: "p2", label: "Paragraph 2", widget: "text" }

  - name: "experience"
    label: "Experience Page"
    files:
      - name: "experience"
        label: "Experience Content"
        file: "content/experience.yml"
        fields:
          - name: "hero"
            label: "Hero"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading_line1", label: "Heading line 1", widget: "string" }
              - { name: "heading_line2_pre", label: "Heading line 2 (before highlight)", widget: "string" }
              - { name: "heading_accent1", label: "Heading highlight word 1", widget: "string" }
              - { name: "heading_accent2", label: "Heading highlight word 2", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
              - { name: "link", label: "Scroll link text", widget: "string" }
          - name: "sectors"
            label: "Sectors"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
              - name: "items"
                label: "Sector Items"
                widget: "list"
                min: 9
                max: 9
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "body", label: "Body", widget: "text" }
              - { name: "note", label: "Note", widget: "text" }
          - name: "intl"
            label: "International Reach"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "body", label: "Body", widget: "text" }
              - { name: "stat1_label", label: "Stat 1 label", widget: "string" }
              - { name: "stat2_label", label: "Stat 2 label", widget: "string" }
          - name: "evidence"
            label: "Evidence"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "num_label", label: "Stat label", widget: "string" }
              - { name: "body", label: "Body", widget: "text" }
              - { name: "cta", label: "Link text", widget: "string" }
          - name: "final_cta"
            label: "Final Call To Action"
            widget: "object"
            fields:
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "body", label: "Body", widget: "text" }

  - name: "about"
    label: "About / History Page"
    files:
      - name: "about"
        label: "About Content"
        file: "content/about.yml"
        fields:
          - name: "opener"
            label: "Opener"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "p1", label: "Paragraph 1", widget: "text" }
              - { name: "p2", label: "Paragraph 2", widget: "text" }
              - { name: "fact1_label", label: "Fact 1 label", widget: "string" }
              - { name: "fact2_label", label: "Fact 2 label", widget: "string" }
              - { name: "fact3_label", label: "Fact 3 label", widget: "string" }
          - name: "overview"
            label: "Overview"
            widget: "object"
            fields:
              - { name: "intro", label: "Intro", widget: "text" }
              - { name: "where_eyebrow", label: "'Where We Work' eyebrow", widget: "string" }
              - { name: "where_body", label: "'Where We Work' body", widget: "text" }
              - { name: "testimonial1_quote", label: "Testimonial 1 quote", widget: "text" }
              - { name: "testimonial2_quote", label: "Testimonial 2 quote", widget: "text" }
              - { name: "testimonial3_quote", label: "Testimonial 3 quote", widget: "text" }
          - name: "name_story"
            label: "Our Name Story"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "p1", label: "Paragraph 1", widget: "text" }
              - { name: "p2", label: "Paragraph 2", widget: "text" }
          - name: "values"
            label: "Values"
            widget: "list"
            min: 3
            max: 3
            fields:
              - { name: "title", label: "Title", widget: "string" }
              - { name: "body", label: "Body", widget: "text" }
          - name: "how_we_work"
            label: "How We Work"
            widget: "object"
            fields:
              - { name: "label", label: "Label", widget: "string" }
              - name: "items"
                label: "Items"
                widget: "list"
                min: 6
                max: 6
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "body", label: "Body", widget: "text" }
          - name: "heritage"
            label: "Heritage"
            widget: "object"
            fields:
              - { name: "label", label: "Label", widget: "string" }

  - name: "leadership"
    label: "Leadership Page"
    files:
      - name: "leadership"
        label: "Leadership Content"
        file: "content/leadership.yml"
        fields:
          - name: "page_header"
            label: "Page Header"
            widget: "object"
            fields:
              - { name: "eyebrow", label: "Eyebrow", widget: "string" }
              - { name: "heading", label: "Heading", widget: "string" }
              - { name: "intro", label: "Intro", widget: "text" }
          - name: "leaders"
            label: "Leaders"
            widget: "list"
            min: 4
            max: 4
            fields:
              - { name: "name", label: "Name and role", widget: "string" }
              - { name: "bio", label: "Biography", widget: "text" }
          - { name: "note", label: "Note", widget: "text" }
          - { name: "testimonial_quote", label: "Testimonial quote", widget: "text" }
          - { name: "testimonial_cite", label: "Testimonial citation", widget: "string" }
