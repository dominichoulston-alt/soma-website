  reserved2_title: "Defence Case Study"
  reserved2_body: "Full case study pending Soma approval."

difference:
  eyebrow: "What Sets Soma Apart"
  heading: "Why organisations choose Soma."
  stages:
    - title: "Four decades of applied experience"
      body: "Since 1984, Soma’s approach has been tested and refined across industries, countries and periods of significant organisational change, giving every engagement the benefit of four decades of applied experience."
    - title: "Shaped around the challenge"
      body: "Every engagement begins with the client’s circumstances, priorities and required outcomes, not a standard programme. That is why the approach fits the organisation, rather than the other way around."
    - title: "People and performance together"
      body: "Soma connects leadership and behavioural change directly to strategy, programme delivery and business performance, so development work is judged by the results it produces, not attendance at a workshop."
    - title: "Capability that lasts"
      body: "Clients leave with the confidence, behaviours and internal capability to continue progressing after the engagement ends, rather than a lasting dependency on external support."
  testimonial_quote: "“A distinctive and highly effective approach that combines leadership development with a true focus on the individual.”"
  testimonial_cite: "Soma client"

testimonials:
  quote1: "“Soma combines deep change management expertise with the ability to develop those skills in others, creating lasting value for organisations.”"
  cite1: "Soma client"
  quote2: "“Working with Soma is a pleasure. Their commitment to exceeding customer expectations shines through in everything they do.”"
  cite2: "Soma client"

contact:
  heading: "Start with the challenge you are facing."
  body: "Whether you are navigating organisational change, strengthening leadership or improving the performance of a major programme, Soma can help establish the clarity, alignment and capability required to move forward."
