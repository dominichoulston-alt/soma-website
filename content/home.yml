hero:
  lead: "Soma"
  line1: "Inspires individuals,"
  line2: "develops teams"
  line3: "and strengthens organisations."
  lede: "For more than four decades, Soma has worked with organisations around the world to develop leaders, strengthen teams and deliver lasting organisational change."
  cta_primary: "Explore Our Expertise"
  cta_secondary: "Discover Soma"

intro:
  eyebrow: "About Soma"
  heading_pre: "Experienced where leadership and "
  heading_accent: "delivery"
  heading_post: " matter most."
  p1: "Established in 1984, Soma works with leaders facing significant organisational change, complex stakeholder environments and demanding programmes."
  p2: "Our work connects leadership, strategy and behaviour with the practical realities of delivery. Every engagement is shaped around the client’s priorities and designed to build capability that lasts."
  cta: "About Soma"
  stat1_label: "Established"
  stat2_label: "Continuous delivery"

history:
  eyebrow: "History"
  heading: "Our History"
  stages:
    - year: "1984"
      range: "1984–1990"
      title: "Foundation and Organisational Development"
      text: "Soma Consultants was established in 1984, focusing on organisational development, leadership effectiveness, team performance and change management. Early work supported organisations across the UK, helping develop the participative and behavioural approaches that remain central to Soma’s methodology today."
    - year: "1990"
      range: "1990–1995"
      title: "Leadership, Culture and Strategic Change"
      text: "Expanded support for public and private sector organisations, delivering leadership development, executive coaching, strategy implementation and cultural change programmes. Built a reputation for helping organisations align people, teams and business objectives across complex projects."
    - year: "1995"
      range: "1995–2000"
      title: "Major Projects and International Expansion"
      text: "Broadened into major project support, project team development and collaborative working programmes. Extended activities beyond the UK into Europe, North America and Australia, laying the foundations for the international client portfolio that developed from 2000 onwards."
    - year: "2000"
      range: "2000–2005"
      title: "Energy, Oil and Gas, Pharmaceuticals and Advanced Manufacturing"
      text: "Established work across the UK energy and industrial sectors, alongside pharmaceutical and manufacturing organisations. Expanded internationally into Ireland, Germany, France, Spain, Australia, Azerbaijan and the USA while continuing to support projects throughout the UK."
    - year: "2006"
      range: "2006–2010"
      title: "Infrastructure, Defence, Utilities, Engineering and Nuclear"
      text: "Broadened into defence, public sector, engineering and utility markets. Geographic reach extended across Scotland, Wales, France, Hungary, the USA and wider Europe, whilst maintaining strong delivery capability across the UK."
    - year: "2011"
      range: "2011–2015"
      title: "Nuclear, Utilities, Construction and Asset Management"
      text: "Strengthened expertise within nuclear, utilities and major infrastructure programmes. Continued UK-wide project delivery while supporting organisations in Australia, Canada, South Africa, the Middle East and North America."
    - year: "2016"
      range: "2016–2020"
      title: "Engineering, Manufacturing, Energy Transition and Major Projects"
      text: "Worked with global engineering, petrochemical, manufacturing and technology organisations. Expanded international activity across the Netherlands, Germany, UAE, Qatar, Azerbaijan, Canada and the USA, alongside ongoing work throughout England, Scotland and Wales."
    - year: "2021"
      range: "2021–2026"
      title: "Energy, Nuclear, Engineering, Construction and Industrial Services"
      text: "Supported large-scale energy, engineering, construction and nuclear programmes across the UK. International footprint further expanded into Bahrain, Georgia, India, Azerbaijan, UAE, Canada and North America, while continuing to deliver services nationwide across the UK."

engage:
  eyebrow: "When Clients Engage Soma"
  heading: "When progress depends on people working differently together."
  intro: "Clients engage Soma when strategic or operational progress depends on stronger leadership, closer collaboration and clearer organisational alignment."
  items:
    - heading_pre: "Organisational "
      heading_accent: "change"
      body: "Soma aligns leadership, culture and behaviour around a new direction, combining facilitated workshops with individual coaching so change takes hold in how people actually work, not just on paper."
    - heading_pre: "Major "
      heading_accent: "programmes"
      body: "Soma creates the collaboration and accountability major programmes depend on, working directly with programme leadership to align priorities across partner organisations and keep delivery on track."
    - heading_pre: "Acquisition and "
      heading_accent: "integration"
      body: "Soma brings organisations and leadership teams together after an acquisition, protecting the relationships, expertise and culture that made the business successful while building one shared way of working."
    - heading_pre: "Leadership and team "
      heading_accent: "performance"
      body: "Soma addresses the behaviours, relationships and decision-making patterns limiting progress, using structured coaching and facilitation to build the trust and accountability high performing teams need."

expertise:
  eyebrow: "Our Expertise"
  heading_pre: "Expertise built around "
  heading_accent: "complex"
  heading_post: " organisational challenges."
  intro: "Soma combines six complementary capabilities to address challenges that cannot be solved through process, structure or training alone."
  panels:
    - title: "Leadership and Executive Development"
      challenge: "Leaders moving into more senior or more complex roles need more than technical skill to succeed."
      does: "Provides coaching and development shaped around the individual and the organisation around them."
      outcome: "Leaders who think strategically, act practically and lead with confidence."
    - title: "Organisational Change and Culture"
      challenge: "Change that looks right on paper often fails to take hold in how people actually work."
      does: "Works through the transition itself, not just its design, so new behaviours and structures stick."
      outcome: "Change that survives beyond the programme, with the culture to sustain it."
    - title: "Team Performance and Collaboration"
      challenge: "Teams under delivery pressure lose trust and struggle to work through conflict productively."
      does: "Builds the understanding and behaviours needed for teams to work through friction and deliver together."
      outcome: "Stronger collaboration and teams that hold together under real pressure."
    - title: "Major Programme Performance"
      challenge: "Complex programmes fail when leadership is fragmented and partner organisations work to different priorities."
      does: "Creates the alignment, behaviours and accountability required for teams to deliver as one."
      outcome: "Programmes that start well, stay aligned and deliver as planned."
    - title: "Strategy and Implementation"
      challenge: "A strategy that is well argued is not yet matched by the capability or commitment needed to deliver it."
      does: "Works with leadership teams to define direction, then builds the capability and commitment to deliver it."
      outcome: "A strategy the organisation acts on, not one that sits in a document."
    - title: "Stakeholder Alignment and Facilitation"
      challenge: "Complex decisions stall when stakeholders hold different priorities and no shared forum exists to resolve them."
      does: "Facilitates the conversations that bring the right people together and turn insight into agreed action."
      outcome: "Clear priorities, aligned stakeholders and a shared starting point for change."
  note: "Most engagements draw on several of these together, tested across nuclear, defence, energy and other complex, regulated environments."
  testimonial_quote: "“Soma equips managers with the awareness, resilience and practical tools needed to thrive in a changing world.”"
  testimonial_cite: "Soma client"

