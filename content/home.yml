  eyebrow: "Our Work"
  heading: "Evidence from Soma’s engagements."
  intro: "A selection of the work Soma has delivered, with further case studies in progress as they are approved for publication."
  badge: "Acquisition & Integration"
  title: "International acquisition and leadership transformation"
  lede1: "A two year engagement supporting integration, leadership succession and significant business growth while maintaining profitability."
  lede2: "Following an acquisition, an Australian based engineering organisation needed to integrate into a larger corporate environment while protecting the expertise, relationships and entrepreneurial culture behind its success. Soma partnered with the leadership team over a two year period, using facilitated workshops, team transformation and individual coaching to build accountability, stakeholder management and a shared vision for growth."
  stat_big_label: "Revenue growth over three years"
  stat1_label: "EBIT maintained above this level"
  stat2_label: "Leadership vacancies filled internally"
  stat3_label: "Agreed actions completed on time"
