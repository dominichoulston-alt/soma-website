  label: "Soma’s Original Service Framework"

methodology:
  eyebrow: "Methodology"
  heading: "Strategy and Implementation"
  p1: "A key role of business leaders is to identify new opportunities to take the business forward, defining strategy to meet customer needs and market conditions. The bigger challenge is creating the capability to deliver that strategy, and managing the resistance that comes with a strategic shift."
  p2: "Soma shifts leaders’ focus from operational management, how to get things done, towards a more balanced strategic leadership mindset, combining rigorous analysis with the skill and will required to make strategy a reality."
